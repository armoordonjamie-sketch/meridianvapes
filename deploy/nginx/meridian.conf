# Meridian Vapes nginx server block.
#
# Meridian-owned only. This does NOT touch the TriPoint server block, the
# default site, or any TriPoint config. Meridian uses its own server_name, its
# own upstream port (8010) and its own sites-available/sites-enabled entry.
#
# TLS: run `certbot --nginx -d meridianvapes.co.uk -d www.meridianvapes.co.uk`
# once to add the 443 block to this file. Renewal is handled by certbot's own
# systemd timer, not by cron and not by deploy.sh. deploy.sh will not overwrite
# this file once it exists, so certbot's edits are preserved.

server {
    listen 80;
    listen [::]:80;
    server_name meridianvapes.co.uk www.meridianvapes.co.uk;

    root /var/www/meridian/site/dist;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # Prerendered HTML + SPA fallback.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    error_page 404 /404.html;

    # Hashed static assets: long cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # API reverse proxy. The full /api/ path is preserved and forwarded to the
    # Meridian FastAPI service on localhost:8010.
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
