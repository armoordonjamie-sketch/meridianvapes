<!doctype html>
<html lang="en-GB" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons / PWA icons (generated from /logo) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0A0B0D" />
    <meta name="color-scheme" content="dark" />

    <!-- Fonts: Manrope (clean geometric sans). Swap or remove in index.html. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />

    <!-- Per-page title, meta description, Open Graph, canonical and JSON-LD
         are injected by the Seo component (react-helmet-async) and prerendered
         into each page's static HTML. They are intentionally NOT hardcoded
         here, to avoid duplicate tags. -->
  </head>
  <body class="bg-ink-950 text-silver-100 font-sans antialiased">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
